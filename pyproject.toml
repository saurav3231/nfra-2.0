[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfra"
version = "3.3.0"
description = "Nonlinear Factorized Recurrent Attention - an efficient, verified recurrent language-model block"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "SAURAV BHANDARI", email = "bhandarisaurav15@gmail.com"}
]
keywords = [
    "neural-networks",
    "efficient-ai",
    "retnet",
    "rwkv",
    "recurrent-attention",
    "sequence-modeling",
    "llm",
    "low-power",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/saurav3231/nfra-2.0"
Repository = "https://github.com/saurav3231/nfra-2.0"
"Bug Tracker" = "https://github.com/saurav3231/nfra-2.0/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Core rules: Pyflakes (F), pycodestyle errors (E4/E7/E9), plus curated
# modern-style rules (isort-style imports, PEP 604 annotations, f-strings).
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# Intentional style in the verified benchmark harness:
#   UP031 / BLE001 — printf-style console output and blind try/except are used
#     deliberately (a failing phase must not kill the resumable overnight run).
#   E402 — env vars (NFRA_*) must be set before importing torch modules.
#   E701 / E702 / E731 — compact config assignments in benchmark modules.
#   E741 — short loop variables (`l`) in hot benchmark loops.
#   RUF001/2/3 — box-drawing glyphs in the ASCII banner docstrings.
ignore = ["UP031", "BLE001", "E402", "E701", "E702", "E731", "E741",
          "RUF001", "RUF002", "RUF003"]