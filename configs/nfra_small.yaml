# NFRA 2.0 Configuration - Small Model
# Balanced performance for mid-range CPUs and edge devices

model:
  vocab_size: 50257
  hidden_size: 512
  num_layers: 8
  fractal_scales: [1, 2, 4]
  dropout: 0.1

advanced:
  use_mixture_of_fractals: true
  use_selective_scanning: true
  use_dynamic_precision: true
  num_fractal_experts: 6
  top_k_experts: 2

training:
  learning_rate: 2e-4
  weight_decay: 0.01
  batch_size: 6
  max_seq_length: 512
  energy_budget: 0.65

dataset:
  name: "wikitext"
  config: "wikitext-2-raw-v1"
  max_samples: null

hardware:
  device: "auto"
  precision: "auto"