# NFRA 2.0 Configuration - Medium Model
# Higher performance for stronger edge devices and laptops

model:
  vocab_size: 50257
  hidden_size: 768
  num_layers: 12
  fractal_scales: [1, 2, 4]
  dropout: 0.1

advanced:
  use_mixture_of_fractals: true
  use_selective_scanning: true
  use_dynamic_precision: true
  num_fractal_experts: 8
  top_k_experts: 3

training:
  learning_rate: 1.5e-4
  weight_decay: 0.01
  batch_size: 4
  max_seq_length: 512
  energy_budget: 0.7

dataset:
  name: "wikitext"
  config: "wikitext-2-raw-v1"

hardware:
  device: "auto"
  precision: "auto"